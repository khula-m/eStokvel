apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: estokvel
  labels:
    app: transaction-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      containers:
        - name: transaction-service
          image: estokvel/transaction-service:latest
          ports:
            - containerPort: 3003
          envFrom:
            - configMapRef:
                name: estokvel-config
            - configMapRef:
                name: database-pool-config
          env:
            - name: PORT
              value: "3003"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: estokvel-secrets
                  key: DATABASE_URL
            - name: DATABASE_POOL_SIZE
              valueFrom:
                configMapKeyRef:
                  name: database-pool-config
                  key: TRANSACTION_SERVICE_POOL_SIZE
            - name: DATABASE_POOL_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: database-pool-config
                  key: TRANSACTION_SERVICE_POOL_TIMEOUT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: estokvel-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /ready
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: estokvel
spec:
  selector:
    app: transaction-service
  ports:
    - port: 3003
      targetPort: 3003
  type: ClusterIP
