apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: estokvel
  labels:
    app: chat-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      containers:
        - name: chat-service
          image: estokvel/chat-service:latest
          ports:
            - containerPort: 3005
          envFrom:
            - configMapRef:
                name: estokvel-config
            - configMapRef:
                name: database-pool-config
          env:
            - name: PORT
              value: "3005"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: estokvel-secrets
                  key: DATABASE_URL
            - name: DATABASE_POOL_SIZE
              valueFrom:
                configMapKeyRef:
                  name: database-pool-config
                  key: CHAT_SERVICE_POOL_SIZE
            - name: DATABASE_POOL_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: database-pool-config
                  key: CHAT_SERVICE_POOL_TIMEOUT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: estokvel-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /ready
              port: 3005
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: estokvel
spec:
  selector:
    app: chat-service
  ports:
    - port: 3005
      targetPort: 3005
  type: ClusterIP
