# ============================================================================
# eStokvel Monolith K8s Deployment
# Temporary: runs the full Express app in K8s until microservices are extracted
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monolith
  namespace: estokvel
  labels:
    app: estokvel
    component: monolith
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # zero-downtime deploys
  selector:
    matchLabels:
      app: estokvel
      component: monolith
  template:
    metadata:
      labels:
        app: estokvel
        component: monolith
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: monolith
          image: ghcr.io/khula-m/estokvel-monolith:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: estokvel-config
          env:
            - name: PORT
              value: "5000"
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: estokvel-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: estokvel-secrets
                  key: JWT_SECRET
            - name: OZOW_SITE_CODE
              valueFrom:
                secretKeyRef:
                  name: estokvel-secrets
                  key: OZOW_SITE_CODE
            - name: OZOW_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: estokvel-secrets
                  key: OZOW_PRIVATE_KEY
            - name: OZOW_API_KEY
              valueFrom:
                secretKeyRef:
                  name: estokvel-secrets
                  key: OZOW_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12 # 60s max startup (migrations)
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      imagePullSecrets:
        - name: ghcr-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: monolith
  namespace: estokvel
  labels:
    app: estokvel
    component: monolith
spec:
  type: ClusterIP
  selector:
    app: estokvel
    component: monolith
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: monolith-hpa
  namespace: estokvel
  labels:
    app: estokvel
    component: monolith
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: monolith
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: monolith-pdb
  namespace: estokvel
  labels:
    app: estokvel
    component: monolith
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: estokvel
      component: monolith
