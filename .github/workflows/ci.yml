name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/estokvel-backend

jobs:
  # ─── Lint & Type-Check ───
  lint:
    name: Lint & Type-Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eStokvel/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: eStokvel/backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit

  # ─── Tests ───
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: eStokvel/backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: estokvel_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:testpass123@localhost:5432/estokvel_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-not-for-production
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: eStokvel/backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test -- --ci --coverage --forceExit
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: eStokvel/backend/coverage/
          retention-days: 14

  # ─── Build Docker Image ───
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: eStokvel/backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: eStokvel/backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Build Admin Dashboard ───
  build-dashboard:
    name: Build Admin Dashboard
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: eStokvel/frontend/web/admin-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: eStokvel/frontend/web/admin-dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.PRODUCTION_API_URL }}
      - name: Upload dashboard build
        uses: actions/upload-artifact@v4
        with:
          name: admin-dashboard-dist
          path: eStokvel/frontend/web/admin-dashboard/dist/
          retention-days: 30

  # ─── Deploy to K8s ───
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Apply K8s manifests
        run: |
          kubectl apply -f eStokvel/k8s/namespace.yaml
          kubectl apply -f eStokvel/k8s/config.yaml
          kubectl apply -f eStokvel/k8s/database-config.yaml
          kubectl apply -f eStokvel/k8s/monolith.yaml
          kubectl apply -f eStokvel/k8s/ingress.yaml

      - name: Update monolith image
        run: |
          kubectl set image deployment/monolith \
            monolith=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n estokvel

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/monolith -n estokvel --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods -n estokvel -l component=monolith
          echo "---"
          kubectl get svc -n estokvel
          echo "---"
          kubectl get ingress -n estokvel

      - name: Smoke test
        run: |
          # Wait for service to be ready
          sleep 10
          # Port-forward and test health endpoint
          kubectl port-forward svc/monolith 8080:80 -n estokvel &
          sleep 5
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health || echo "000")
          kill %1 2>/dev/null || true
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Health check failed with status $HTTP_STATUS"
            echo "Rolling back..."
            kubectl rollout undo deployment/monolith -n estokvel
            exit 1
          fi
          echo "Health check passed (HTTP $HTTP_STATUS)"
