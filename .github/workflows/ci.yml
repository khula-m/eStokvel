name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/estokvel-backend

jobs:
  # ─── Lint & Type-Check ───
  lint:
    name: Lint & Type-Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eStokvel/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: eStokvel/backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit

  # ─── Tests ───
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: eStokvel/backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: estokvel_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:testpass123@localhost:5432/estokvel_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-not-for-production
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: eStokvel/backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test -- --ci --coverage --forceExit
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: eStokvel/backend/coverage/
          retention-days: 14

  # ─── Build Docker Image ───
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: eStokvel/backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: eStokvel/backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Build Admin Dashboard ───
  build-dashboard:
    name: Build Admin Dashboard
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: eStokvel/frontend/web/admin-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: eStokvel/frontend/web/admin-dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.PRODUCTION_API_URL }}
      - name: Upload dashboard build
        uses: actions/upload-artifact@v4
        with:
          name: admin-dashboard-dist
          path: eStokvel/frontend/web/admin-dashboard/dist/
          retention-days: 30

  # ─── Deploy to Railway (auto-deploy on push to main) ───
  # Railway auto-deploys from GitHub — this job verifies the deployment
  deploy-verify:
    name: Verify Railway Deployment
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Wait for Railway deploy
        run: |
          echo "Railway auto-deploys on push to main..."
          echo "Waiting 90s for Railway to build and deploy..."
          sleep 90

      - name: Health check
        run: |
          RAILWAY_URL="${{ vars.RAILWAY_URL }}"
          if [ -z "$RAILWAY_URL" ]; then
            RAILWAY_URL="https://estokvel-production.up.railway.app"
          fi
          echo "Checking $RAILWAY_URL/health ..."

          MAX_RETRIES=6
          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$RAILWAY_URL/health" || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Health check passed (HTTP $HTTP_STATUS)"
              exit 0
            fi
            echo "Attempt $i/$MAX_RETRIES: HTTP $HTTP_STATUS — retrying in 15s..."
            sleep 15
          done

          echo "❌ Health check failed after $MAX_RETRIES attempts"
          exit 1

      - name: Smoke test API
        run: |
          RAILWAY_URL="${{ vars.RAILWAY_URL }}"
          if [ -z "$RAILWAY_URL" ]; then
            RAILWAY_URL="https://estokvel-production.up.railway.app"
          fi

          # Test auth endpoint responds
          AUTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$RAILWAY_URL/api/auth/login" -X POST -H "Content-Type: application/json" -d '{}' || echo "000")
          echo "Auth endpoint: HTTP $AUTH_STATUS"
          # 400 = working (bad request expected), 401 = working, 5xx = broken
          if [ "$AUTH_STATUS" -ge 500 ] 2>/dev/null; then
            echo "❌ API returning server errors"
            exit 1
          fi
          echo "✅ API is responding correctly"
